name: Bug report
description: Report a reproducible problem using synthetic or sanitized data only.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach confidential, client-derived, personal, privileged, or production data. Create a minimal synthetic reproduction instead.
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide exact steps and a synthetic sample when one is necessary.
    validations:
      required: true
  - type: dropdown
    id: workflow
    attributes:
      label: Workflow
      options:
        - RFP / Pleading Ranges
        - Privilege Log
        - Upload or validation
        - Deployment or build
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or revision
      description: Provide the release, image tag, or source revision when known.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include browser, operating system, deployment method, and relevant non-secret configuration.
  - type: checkboxes
    id: privacy
    attributes:
      label: Data-safety confirmation
      options:
        - label: I have not included confidential, client-derived, personal, privileged, or production data.
          required: true
