name: Publish Docker image

on:
  workflow_call:
    inputs:
      release_version:
        description: Application version verified by the CI workflow.
        required: true
        type: string
    secrets:
      docker_username:
        description: Docker Hub username.
        required: true
      docker_password:
        description: Docker Hub personal access token with write access.
        required: true

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: docker.io/${{ secrets.docker_username }}/production-tool
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate release and registry configuration
        id: release
        shell: bash
        env:
          DOCKER_USERNAME: ${{ secrets.docker_username }}
          DOCKER_PASSWORD: ${{ secrets.docker_password }}
          EXPECTED_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          test -n "$DOCKER_USERNAME" || { echo "DOCKER_USERNAME is not configured." >&2; exit 1; }
          test -n "$DOCKER_PASSWORD" || { echo "DOCKER_PASSWORD is not configured." >&2; exit 1; }
          python deploy/verify_release_metadata.py

          release_version="$(tr -d '\r\n' < VERSION)"
          test "$release_version" = "$EXPECTED_VERSION" || {
            echo "CI version '$EXPECTED_VERSION' does not match VERSION '$release_version'." >&2
            exit 1
          }
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v${release_version}" ]]; then
            echo "Release tag '$GITHUB_REF_NAME' must match VERSION as 'v${release_version}'." >&2
            exit 1
          fi

          echo "build_date=$(git show -s --format=%cI "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.docker_username }}
          password: ${{ secrets.docker_password }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Generate image tags and labels
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=Production Tool
            org.opencontainers.image.description=Internal CSV preparation tool for RFP ranges and privilege logs
            org.opencontainers.image.licenses=MIT

      - name: Build and push production image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
          build-args: |
            RELEASE_VERSION=${{ inputs.release_version }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.release.outputs.build_date }}
          cache-from: type=gha,scope=production-tool
          cache-to: type=gha,mode=max,scope=production-tool
          provenance: mode=max
          sbom: true

      - name: Record immutable deployment reference
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "## Published Docker image"
            echo
            echo "- Digest: \`$IMAGE_DIGEST\`"
            echo "- Source revision: \`$GITHUB_SHA\`"
            echo "- Platform: \`linux/amd64\`"
            echo
            echo "Deploy the image by digest from the Docker Hub repository named \`production-tool\`."
          } >> "$GITHUB_STEP_SUMMARY"
