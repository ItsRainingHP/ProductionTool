name: CSV production validation

on:
  push:
    paths:
      - "backend/**"
      - "examples/**"
      - ".github/workflows/csv-production-validation.yml"
  pull_request:
    paths:
      - "backend/**"
      - "examples/**"
      - ".github/workflows/csv-production-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: csv-production-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-corpus:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Run every CSV through the production lifecycle
        working-directory: backend
        run: >-
          python scripts/validate_production_corpus.py
          --json-report "${{ runner.temp }}/csv-production-report/report.json"
          --markdown-report "${{ runner.temp }}/csv-production-report/report.md"
      - name: Publish job summary
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/csv-production-report/report.md" ]]; then
            cat "$RUNNER_TEMP/csv-production-report/report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "CSV production validation ended before a report was created." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: csv-production-report
          path: ${{ runner.temp }}/csv-production-report/
          if-no-files-found: warn
          retention-days: 30
