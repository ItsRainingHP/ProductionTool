name: CSV production validation

on:
  push:
    paths:
      - "backend/**"
      - "examples/**"
      - ".github/workflows/csv-production-validation.yml"
  pull_request:
    paths:
      - "backend/**"
      - "examples/**"
      - ".github/workflows/csv-production-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: csv-production-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-corpus:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.lock
      - name: Install backend dependencies
        run: python -m pip install --require-hashes -r backend/requirements-dev.lock
      - name: Run every CSV through the production lifecycle
        working-directory: backend
        run: >-
          python scripts/validate_production_corpus.py
          --json-report "${{ runner.temp }}/csv-production-report/report.json"
          --markdown-report "${{ runner.temp }}/csv-production-report/report.md"
      - name: Publish job summary
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/csv-production-report/report.md" ]]; then
            cat "$RUNNER_TEMP/csv-production-report/report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "CSV production validation ended before a report was created." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: csv-production-report
          path: ${{ runner.temp }}/csv-production-report/
          if-no-files-found: warn
          retention-days: 30
