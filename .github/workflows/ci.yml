name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify release metadata
        run: python deploy/verify_release_metadata.py
      - name: Export release version
        id: release
        shell: bash
        run: echo "version=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_OUTPUT"

  backend:
    runs-on: ubuntu-latest
    needs: release-metadata
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.lock
      - name: Install backend dependencies
        run: python -m pip install --require-hashes -r backend/requirements-dev.lock
      - name: Verify backend dependencies
        run: python -m pip check
      - name: Audit backend dependencies
        working-directory: backend
        run: python -m pip_audit -r requirements-dev.lock
      - name: Lint backend
        working-directory: backend
        run: python -m ruff check app tests scripts ../deploy/verify_release_metadata.py ../deploy/verify_runtime.py
      - name: Type-check backend
        working-directory: backend
        run: python -m mypy app
      - name: Run backend tests
        working-directory: backend
        run: python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=98

  frontend:
    runs-on: ubuntu-latest
    needs: release-metadata
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Audit all frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=low
      - name: Type-check
        working-directory: frontend
        run: npm run typecheck
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Check unused code and dependencies
        working-directory: frontend
        run: npm run check:unused
      - name: Run frontend tests
        working-directory: frontend
        run: npm run test:coverage
      - name: Test streaming container proxy
        run: node --test deploy/http-proxy.test.cjs
      - name: Build production frontend
        working-directory: frontend
        run: npm run build

  production-container:
    runs-on: ubuntu-latest
    needs: [release-metadata, backend, frontend]
    env:
      IMAGE_TAG: production-tool-ci:${{ needs.release-metadata.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install browser-test dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Build production image
        shell: bash
        run: |
          build_date="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          docker build \
            --tag "$IMAGE_TAG" \
            --build-arg RELEASE_VERSION="${{ needs.release-metadata.outputs.version }}" \
            --build-arg VCS_REF="$GITHUB_SHA" \
            --build-arg BUILD_DATE="$build_date" \
            .
      - name: Verify image identity and non-root user
        shell: bash
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' "$IMAGE_TAG")" = "app"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "$IMAGE_TAG")" = "${{ needs.release-metadata.outputs.version }}"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$IMAGE_TAG")" = "$GITHUB_SHA"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.licenses"}}' "$IMAGE_TAG")" = "MIT"
          docker image inspect "$IMAGE_TAG" > production-tool-image-inspect.json
      - name: Create container SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE_TAG }}
          artifact-name: production-tool.spdx.json
          output-file: production-tool.spdx.json
      - name: Validate SBOM and create license inventory
        shell: bash
        run: |
          jq -e '.packages | length > 0' production-tool.spdx.json >/dev/null
          jq -r '
            (["name", "version", "license_concluded", "license_declared"] | @tsv),
            (.packages[] | [
              .name,
              (.versionInfo // "UNKNOWN"),
              (.licenseConcluded // "NOASSERTION"),
              (.licenseDeclared // "NOASSERTION")
            ] | @tsv)
          ' production-tool.spdx.json > third-party-licenses.tsv
          test -s third-party-licenses.tsv
      - name: Scan production image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          version: v0.76.1
          image-ref: ${{ env.IMAGE_TAG }}
          format: table
          exit-code: "1"
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          scanners: vuln,secret
      - name: Start production container
        shell: bash
        run: |
          docker volume create production-tool-ci-data
          docker network create production-tool-ci-private
          image_digest="$(docker image inspect --format '{{.Id}}' "$IMAGE_TAG")"
          echo "EXPECTED_IMAGE_DIGEST=$image_digest" >> "$GITHUB_ENV"
          docker run --detach --name production-tool-ci \
            --network production-tool-ci-private \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --mount source=production-tool-ci-data,target=/data \
            --env IMAGE_DIGEST="$image_digest" \
            --publish 127.0.0.1:3000:3000 \
            "$IMAGE_TAG"
      - name: Wait for application health
        shell: bash
        run: |
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/healthz >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs production-tool-ci
          exit 1
      - name: Verify production security headers
        shell: bash
        run: |
          curl --fail --silent --dump-header "$RUNNER_TEMP/headers.txt" --output /dev/null http://127.0.0.1:3000/
          grep -Eiq '^cache-control: no-store' "$RUNNER_TEMP/headers.txt"
          grep -Eiq '^x-content-type-options: nosniff' "$RUNNER_TEMP/headers.txt"
          grep -Eiq '^x-frame-options: DENY' "$RUNNER_TEMP/headers.txt"
          grep -Eiq '^referrer-policy: same-origin' "$RUNNER_TEMP/headers.txt"
      - name: Verify installed runtime and SQLite versions
        run: docker exec production-tool-ci python /app/verify_runtime.py
      - name: Verify runtime limits and container hardening
        shell: bash
        run: |
          curl --fail --silent http://127.0.0.1:3000/api/v1/capabilities \
            | jq -e '.max_upload_bytes == 524288000 and .job_ttl_seconds == 14400' >/dev/null
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' production-tool-ci)" = "true"
          test "$(docker inspect --format '{{.HostConfig.Privileged}}' production-tool-ci)" = "false"
          docker inspect --format '{{json .HostConfig.CapDrop}}' production-tool-ci | grep -q 'ALL'
          docker inspect --format '{{json .HostConfig.SecurityOpt}}' production-tool-ci | grep -q 'no-new-privileges:true'
          test "$(docker port production-tool-ci 3000/tcp)" = "127.0.0.1:3000"
          test "$(docker inspect --format '{{.HostConfig.NetworkMode}}' production-tool-ci)" = "production-tool-ci-private"
          test "$(docker network inspect --format '{{len .Containers}}' production-tool-ci-private)" = "1"
          docker inspect production-tool-ci > production-tool-runtime-inspect.json
      - name: Deny default-bridge bypass
        shell: bash
        run: |
          app_ip="$(docker inspect --format '{{(index .NetworkSettings.Networks "production-tool-ci-private").IPAddress}}' production-tool-ci)"
          test -n "$app_ip"
          if docker run --rm --network bridge --entrypoint curl "$IMAGE_TAG" \
            --fail --silent --max-time 3 "http://$app_ip:3000/api/healthz"; then
            echo "Default-bridge peer reached the application directly" >&2
            exit 1
          fi
      - name: Run production browser smoke tests
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
        run: npm run test:e2e
      - name: Show container logs after failure
        if: failure()
        shell: bash
        run: |
          if docker container inspect production-tool-ci >/dev/null 2>&1; then
            docker logs production-tool-ci || true
          else
            echo "Container production-tool-ci was not created; see the earlier failed step."
          fi
      - name: Assemble release evidence
        if: always()
        shell: bash
        run: |
          cp VERSION release-version.txt
          cp deploy/release-metadata.json release-metadata.json
          sha256sum \
            release-version.txt \
            release-metadata.json \
            production-tool-image-inspect.json \
            production-tool-runtime-inspect.json \
            production-tool.spdx.json \
            third-party-licenses.tsv \
            > release-artifact-checksums.sha256 2>/dev/null || true
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-evidence-${{ needs.release-metadata.outputs.version }}-${{ github.sha }}
          path: |
            release-version.txt
            release-metadata.json
            release-artifact-checksums.sha256
            production-tool-image-inspect.json
            production-tool-runtime-inspect.json
            production-tool.spdx.json
            third-party-licenses.tsv
          if-no-files-found: warn
          retention-days: 90
      - name: Stop production container
        if: always()
        run: |
          docker rm --force production-tool-ci || true
          docker volume rm production-tool-ci-data || true

  publish-image:
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [release-metadata, production-container]
    uses: ./.github/workflows/docker-publish.yml
    with:
      release_version: ${{ needs.release-metadata.outputs.version }}
    secrets:
      docker_username: ${{ secrets.DOCKER_USERNAME }}
      docker_password: ${{ secrets.DOCKER_PASSWORD }}
