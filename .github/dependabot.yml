version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      compatible-updates:
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    groups:
      compatible-updates:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      compatible-updates:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      compatible-updates:
        update-types: [minor, patch]
