# Runs the API and web server together in the production container.
# Author: Brent Coleman
# Copyright (c) 2026 Brent Coleman
# SPDX-License-Identifier: MIT

[supervisord]
nodaemon=true
user=app
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:api]
command=python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 --no-access-log
directory=/app/backend
environment=PYTHONPATH="/app/backend",JOB_DATA_DIR="/data/jobs"
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:web]
command=node server.js
directory=/app/frontend
environment=NODE_ENV="production",PORT="3000",HOSTNAME="0.0.0.0",API_ORIGIN="http://127.0.0.1:8000"
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
